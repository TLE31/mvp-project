[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "changeguard"
version = "0.1.0"
description = "Local change impact analysis for Java and Maven services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "GitPython>=3.1",
  "tree-sitter>=0.23",
  "tree-sitter-java>=0.23",
  "networkx>=3.2",
  "pyvis>=0.3.2",
  "mcp>=1.2,<2",
  "typer>=0.12",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
changeguard = "changeguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
