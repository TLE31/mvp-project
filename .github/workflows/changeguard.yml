name: ChangeGuard

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install ChangeGuard
        run: python -m pip install -e .
      - name: Analyze changes
        run: changeguard analyze --base "${{ github.event.pull_request.base.sha }}" --output changeguard-summary.md
      - name: Run impacted tests
        run: changeguard run-tests --base "${{ github.event.pull_request.base.sha }}" --output changeguard-summary.md
      - name: Generate graph report
        if: always()
        run: changeguard report --base "${{ github.event.pull_request.base.sha }}" --output changeguard-report.html
      - name: Comment summary on pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('changeguard-summary.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const marker = '<!-- changeguard-report -->';
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(comment => comment.body.includes(marker));
            const comment = `${marker}\n${body}`;
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: comment });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: comment });
            }
      - name: Upload graph report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: changeguard-report
          path: changeguard-report.html
